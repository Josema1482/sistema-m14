<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>TaskFlow PRO</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<link rel="stylesheet"
    href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</head>

<body>

<div class="container-fluid p-4">

    <!-- TOPBAR -->

    <div class="topbar">

        <div>

            <h2 class="mb-0">
                TaskFlow PRO
            </h2>

            <small>
                Sistema de seguimiento
            </small>

        </div>

        <div class="d-flex gap-2">

            <button class="btn btn-dark"
                onclick="toggleDarkMode()">

                🌙

            </button>

            <button class="btn btn-success"
                onclick="exportarBackup()">

                Backup

            </button>

            <button class="btn btn-outline-success"
                onclick="exportarExcel()">

                Excel

            </button>

            <button class="btn btn-outline-danger"
                onclick="exportarPDF()">

                PDF

            </button>

            <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#modalNueva">

                Nueva tarea

            </button>

        </div>

    </div>

    <!-- DASHBOARD -->

    <div class="dashboard">

        <div class="dashboard-card">

            <h6>Pendientes</h6>

            <h2 id="cantPendientes">
                0
            </h2>

        </div>

        <div class="dashboard-card">

            <h6>En proceso</h6>

            <h2 id="cantProceso">
                0
            </h2>

        </div>

        <div class="dashboard-card">

            <h6>Vencidas</h6>

            <h2 id="cantVencidas">
                0
            </h2>

        </div>

        <div class="dashboard-card">

            <h6>Finalizadas</h6>

            <h2 id="cantFinalizadas">
                0
            </h2>

        </div>

    </div>

    <!-- GRAFICOS -->

    <div class="row mb-4">

        <div class="col-md-6">

            <div class="card-box">

                <h5>
                    Tareas por estado
                </h5>

                <canvas id="graficoEstados"></canvas>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card-box">

                <h5>
                    Tareas por prioridad
                </h5>

                <canvas id="graficoPrioridades"></canvas>

            </div>

        </div>

    </div>

    <!-- FILTROS -->

    <div class="card-box mb-3">

        <div class="row g-2">

            <div class="col-md-3">

                <input type="text"
                    id="buscar"
                    class="form-control"
                    placeholder="Buscar tarea">

            </div>

            <div class="col-md-2">

                <select id="filtroEstado"
                    class="form-select">

                    <option value="">
                        Todos
                    </option>

                    <option value="Pendiente">
                        Pendiente
                    </option>

                    <option value="En proceso">
                        En proceso
                    </option>

                    <option value="Esperando proveedor">
                        Esperando proveedor
                    </option>

                    <option value="Finalizada">
                        Finalizada
                    </option>

                </select>

            </div>

            <div class="col-md-2">

                <select id="filtroCategoria"
                    class="form-select">

                    <option value="">
                        Categorías
                    </option>

                    <option>
                        Compras
                    </option>

                    <option>
                        Logística
                    </option>

                    <option>
                        Aduana
                    </option>

                    <option>
                        Administración
                    </option>

                    <option>
                        Sistemas
                    </option>

                </select>

            </div>

            <div class="col-md-2">

                <select id="filtroPrioridad"
                    class="form-select">

                    <option value="">
                        Prioridad
                    </option>

                    <option>
                        Alta
                    </option>

                    <option>
                        Media
                    </option>

                    <option>
                        Baja
                    </option>

                </select>

            </div>

        </div>

    </div>

    <!-- TABLA -->

    <div class="card-box">

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                    <tr>

                        <th>#</th>

                        <th>Estado</th>

                        <th>Prioridad</th>

                        <th>Categoría</th>

                        <th>Esperando</th>

                        <th>Proveedor</th>

                        <th>Pedido por</th>

                        <th>Tarea</th>

                        <th>Necesidad</th>

                        <th>Días</th>

                        <th>Acción</th>

                    </tr>

                </thead>

                <tbody id="tablaTareas"></tbody>

            </table>

        </div>

    </div>

</div>

<!-- MODAL NUEVA -->

<div class="modal fade"
    id="modalNueva">

<div class="modal-dialog modal-xl">

<div class="modal-content">

<div class="modal-header">

    <h5>
        Nueva tarea
    </h5>

</div>

<div class="modal-body">

<div class="row">

    <div class="col-md-3 mb-3">

        <label>
            Categoría
        </label>

        <select id="categoria"
            class="form-select">

            <option>
                Compras
            </option>

            <option>
                Logística
            </option>

            <option>
                Aduana
            </option>

            <option>
                Administración
            </option>

            <option>
                Sistemas
            </option>

        </select>

    </div>

    <div class="col-md-3 mb-3">

        <label>
            Esperando respuesta
        </label>

        <select id="esperandoRespuesta"
            class="form-select">

            <option value="">
                Nadie
            </option>

            <option>
                Proveedor
            </option>

            <option>
                Cliente
            </option>

            <option>
                Logística
            </option>

            <option>
                Administración
            </option>

            <option>
                Interno
            </option>

        </select>

    </div>

    <div class="col-md-3 mb-3">

        <label>
            Recurrente
        </label>

        <select id="recurrente"
            class="form-select">

            <option value="">
                No
            </option>

            <option>
                Diaria
            </option>

            <option>
                Semanal
            </option>

            <option>
                Mensual
            </option>

        </select>

    </div>

    <div class="col-md-3 mb-3 d-flex align-items-end">

        <div class="form-check">

            <input
                class="form-check-input"
                type="checkbox"
                id="fijada">

            <label class="form-check-label">

                Fijar tarea

            </label>

        </div>

    </div>

    <div class="col-md-6 mb-3">

        <label>
            Proveedor
        </label>

        <input type="text"
            id="proveedor"
            class="form-control">

    </div>

    <div class="col-md-6 mb-3">

        <label>
            Pedido por
        </label>

        <input type="text"
            id="pedidoPor"
            class="form-control">

    </div>

    <div class="col-md-12 mb-3">

        <label>
            Tarea
        </label>

        <textarea id="descripcion"
            rows="4"
            class="form-control"></textarea>

    </div>

    <div class="col-md-4 mb-3">

        <label>
            Prioridad
        </label>

        <select id="prioridad"
            class="form-select">

            <option>
                Alta
            </option>

            <option>
                Media
            </option>

            <option>
                Baja
            </option>

        </select>

    </div>

    <div class="col-md-4 mb-3">

        <label>
            Fecha inicio
        </label>

        <input type="date"
            id="fechaInicio"
            class="form-control">

    </div>

    <div class="col-md-4 mb-3">

        <label>
            Fecha necesidad
        </label>

        <input type="date"
            id="fechaNecesidad"
            class="form-control">

    </div>

    <div class="col-md-12 mb-3">

        <label>
            Adjuntos
        </label>

        <input type="file"
            id="archivo"
            class="form-control"
            multiple>

    </div>

</div>

</div>

<div class="modal-footer">

    <button class="btn btn-secondary"
        data-bs-dismiss="modal">

        Cancelar

    </button>

    <button class="btn btn-primary"
        onclick="guardarTarea()">

        Guardar

    </button>

</div>

</div>
</div>
</div>

<!-- MODAL DETALLE -->

<div class="modal fade"
    id="modalDetalle">

<div class="modal-dialog modal-xl">

<div class="modal-content">

<div class="modal-header">

    <h5>
        Detalle tarea
    </h5>

</div>

<div class="modal-body"
    id="detalleContenido"></div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module" src="app.js"></script>

</body>
</html>
